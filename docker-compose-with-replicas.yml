version: '3.8'

services:
  app1:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ha_app1
    working_dir: /var/www
    volumes:
      - ./lumen-app:/var/www
    environment:
      - DB_HOST=db
      - DB_MASTER_HOST=db
      - DB_SLAVE1_HOST=postgres-haproxy
      - DB_PORT=5432
      - DB_DATABASE=social
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
      - DB_READ_FALLBACK_TO_MASTER=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - DIALOG_STORAGE=sql
      - DIALOG_REDIS_PREFIX=dialog
      - "DIALOG_REDIS_MESSAGE_PREFIX=dialog:message:"
      - DIALOG_RECIPIENT_CACHE_TTL_SEC=3600
      - CHAT_SERVICE_BASE_URL=http://chat-service:8081
      - CHAT_SERVICE_TIMEOUT_SEC=3
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_VHOST=/
      - RABBITMQ_LOGIN=guest
      - RABBITMQ_PASSWORD=guest
      - QUEUE_CONNECTION=database
      - MAX_POST_FOLLOWERS=500
    depends_on:
      - db
      - postgres-haproxy
      - redis
      - chat-service
    networks:
      - appnet

  app2:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ha_app2
    working_dir: /var/www
    volumes:
      - ./lumen-app:/var/www
    environment:
      - DB_HOST=db
      - DB_MASTER_HOST=db
      - DB_SLAVE1_HOST=postgres-haproxy
      - DB_PORT=5432
      - DB_DATABASE=social
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
      - DB_READ_FALLBACK_TO_MASTER=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - DIALOG_STORAGE=sql
      - DIALOG_REDIS_PREFIX=dialog
      - "DIALOG_REDIS_MESSAGE_PREFIX=dialog:message:"
      - DIALOG_RECIPIENT_CACHE_TTL_SEC=3600
      - CHAT_SERVICE_BASE_URL=http://chat-service:8081
      - CHAT_SERVICE_TIMEOUT_SEC=3
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_VHOST=/
      - RABBITMQ_LOGIN=guest
      - RABBITMQ_PASSWORD=guest
      - QUEUE_CONNECTION=database
      - MAX_POST_FOLLOWERS=500
    depends_on:
      - db
      - postgres-haproxy
      - redis
      - chat-service
    networks:
      - appnet

  app3:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ha_app3
    working_dir: /var/www
    volumes:
      - ./lumen-app:/var/www
    environment:
      - DB_HOST=db
      - DB_MASTER_HOST=db
      - DB_SLAVE1_HOST=postgres-haproxy
      - DB_PORT=5432
      - DB_DATABASE=social
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
      - DB_READ_FALLBACK_TO_MASTER=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - DIALOG_STORAGE=sql
      - DIALOG_REDIS_PREFIX=dialog
      - "DIALOG_REDIS_MESSAGE_PREFIX=dialog:message:"
      - DIALOG_RECIPIENT_CACHE_TTL_SEC=3600
      - CHAT_SERVICE_BASE_URL=http://chat-service:8081
      - CHAT_SERVICE_TIMEOUT_SEC=3
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_VHOST=/
      - RABBITMQ_LOGIN=guest
      - RABBITMQ_PASSWORD=guest
      - QUEUE_CONNECTION=database
      - MAX_POST_FOLLOWERS=500
    depends_on:
      - db
      - postgres-haproxy
      - redis
      - chat-service
    networks:
      - appnet

  chat-service:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ha_chat_service
    working_dir: /var/www
    volumes:
      - ./chat-service:/var/www
    command: php -S 0.0.0.0:8081 -t public public/index.php
    ports:
      - "8086:8081"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=social
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - DIALOG_STORAGE=redis
      - DIALOG_REDIS_PREFIX=dialog
      - "DIALOG_REDIS_MESSAGE_PREFIX=dialog:message:"
      - DIALOG_RECIPIENT_CACHE_TTL_SEC=3600
    depends_on:
      - db
      - redis
    networks:
      - appnet

  db:
    image: postgres:16
    container_name: ha_db
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_HOST_AUTH_METHOD: trust
    command: postgres -c wal_level=replica -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby=on -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "6433:5432"
    volumes:
      - ./volumes/ha/pgmaster:/var/lib/postgresql/data
      - ./docker/import:/import
      - ./docker/postgres/master/init:/docker-entrypoint-initdb.d
      - ./docker/postgres/master/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - appnet

  pgslave1:
    build:
      context: .
      dockerfile: docker/postgres-slave/Dockerfile
    container_name: ha_pgslave1
    environment:
      PRIMARY_HOST: db
      REPLICATION_USER: replicator
    ports:
      - "16432:5432"
    volumes:
      - ./volumes/ha/pgslave1:/var/lib/postgresql/data
    depends_on:
      - db
    networks:
      - appnet

  pgslave2:
    build:
      context: .
      dockerfile: docker/postgres-slave/Dockerfile
    container_name: ha_pgslave2
    environment:
      PRIMARY_HOST: db
      REPLICATION_USER: replicator
    ports:
      - "26432:5432"
    volumes:
      - ./volumes/ha/pgslave2:/var/lib/postgresql/data
    depends_on:
      - db
    networks:
      - appnet

  postgres-haproxy:
    image: haproxy:2.9-alpine
    container_name: ha_postgres_haproxy
    ports:
      - "6432:5432"
      - "8404:8404"
    volumes:
      - ./docker/haproxy/postgres.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - pgslave1
      - pgslave2
    networks:
      - appnet

  nginx:
    image: nginx:stable-alpine
    container_name: ha_nginx
    ports:
      - "8085:80"
    volumes:
      - ./lumen-app:/var/www
      - ./docker/nginx/default-replicas.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    container_name: ha_redis
    ports:
      - "6380:6379"
    volumes:
      - ./volumes/ha/redis:/data
    command: redis-server --appendonly yes
    networks:
      - appnet

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ha_rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ./volumes/ha/rabbitmq:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
