version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lumen_app
    working_dir: /var/www
    volumes:
      - ./lumen-app:/var/www
    ports:
      - "8090:8090"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=social
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_VHOST=/
      - RABBITMQ_LOGIN=guest
      - RABBITMQ_PASSWORD=guest
      - QUEUE_CONNECTION=database
      - MAX_POST_FOLLOWERS=500
    depends_on:
      - db
    networks:
      - citusnet

  db:
    image: postgres:16
    container_name: lumen_postgres
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - ./volumes/pgmaster:/var/lib/postgresql/data
      - ./docker/import:/import
    networks:
      - citusnet

  pgslave:
    image: postgres:16
    container_name: pgslave
    environment:
      POSTGRES_PASSWORD: pass
    ports:
      - "15432:5432"
    volumes:
      - ./volumes/pgslave:/var/lib/postgresql/data
    depends_on:
      - db

  pgasyncslave:
    image: postgres:16
    container_name: pgasyncslave
    environment:
      POSTGRES_PASSWORD: pass
    ports:
      - "25432:5432"
    volumes:
      - ./volumes/pgasyncslave:/var/lib/postgresql/data
    depends_on:
      - db

  nginx:
    image: nginx:stable-alpine
    container_name: lumen_nginx
    ports:
      - "8080:80"
    volumes:
      - ./lumen-app:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - citusnet

  redis:
    image: redis:7-alpine
    container_name: lumen_redis
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    networks:
      - citusnet

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./volumes/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - db

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./volumes/prometheus:/etc/prometheus
      - /var/run/docker.sock:/var/run/docker.sock

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command:
      - "--docker_only=true"
      - "--store_container_labels=true"
      - "--whitelisted_container_labels=io.kubernetes.container.name,com.docker.compose.service,name,container_name,io.kubernetes.pod.name"

  node-exporter:
    image: prom/node-exporter
    container_name: node_exporter
    ports:
      - "9100:9100"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lumen_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - citusnet

volumes:
  pgdata:

networks:
  citusnet:
    driver: bridge