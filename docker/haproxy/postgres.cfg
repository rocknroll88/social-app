global
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend postgres_reads
    bind *:5432
    default_backend postgres_slaves

backend postgres_slaves
    balance roundrobin
    option tcp-check
    default-server inter 2s fall 2 rise 1 on-marked-down shutdown-sessions
    server pgslave1 pgslave1:5432 check
    server pgslave2 pgslave2:5432 check

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
