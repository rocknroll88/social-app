upstream php_backend {
    least_conn;
    server app1:9000 max_fails=3 fail_timeout=5s;
    server app2:9000 max_fails=3 fail_timeout=5s;
    server app3:9000 max_fails=3 fail_timeout=5s;
}

log_format upstreamlog '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'upstream=$upstream_addr upstream_status=$upstream_status '
                      'request_time=$request_time upstream_time=$upstream_response_time';

server {
    listen 80;
    server_name localhost;

    root /var/www/public;
    index index.php index.html;

    access_log /var/log/nginx/access.log upstreamlog;
    error_log /var/log/nginx/error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_next_upstream error timeout invalid_header http_500 http_503;
        fastcgi_next_upstream_tries 3;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
